<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi's - Levi Strauss & Co.</title>
    <link rel="stylesheet" href="assets/styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/styles/images/levis.svg">
</head>
<body>
    <header>

        <section class="sign-up-promo">
            <p>
                Sign up and get 20% off to your first order.
                <a href="account.html">Sign Up Now</a>
                <i class="fa-solid fa-xmark"></i>
            </p>
        </section>

        <nav>
            <a href="index.html"><img class="logo" src="assets/styles/images/levis.svg" alt="levi's"></a>

            <div class="menu">
                <a href="shop.html" class="shop-button">Shop Now</a>
                <div><a href="aboutus.html">About Us</a></div>
                <div><a href="contact.html">Contact</a></div>
            </div>

            <label class="search-bar">
                <i class="fa-brands fa-sistrix"></i>
                <input type="search" placeholder="Search...">
            </label>

            <div class="nav-icons">
                <a href="#">   
                    <img src="assets/styles/images/shop.svg" alt="Cart">
                </a>
                <a href="account.html">
                    <img src="assets/styles/images/account.svg" alt="Account">
                </a>
            </div>

            <div class="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>

        </nav>

    </header>

    <main class="contact-page">
        <h1>CONTACT US</h1>
        <div class="contact-container">
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>Email: support@levis.com</p>
                <p>Phone: +123 456 789</p>
                <p>Address: San Francisco, California</p>
            </div>

            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="6"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>
</body>
</html>
